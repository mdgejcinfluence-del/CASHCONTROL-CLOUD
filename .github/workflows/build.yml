name: CashControl Cloud Auto-Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4
      
      - name: ☕ Configuration de Java (LTS 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: 🚀 Configuration de Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0' 
          cache: true
          
      - name: 📦 Installation des dépendances
        run: flutter pub get
        
      - name: 🛠 Compilation de l'APK (Standard Release)
        # Suppression de l'option erronée
        run: flutter build apk --release
        
      - name: 📤 Livraison de l'APK
        uses: actions/upload-artifact@v4
        with:
          name: CashControl-Cloud-APK
          path: build/app/outputs/flutter-apk/app-release.apk
